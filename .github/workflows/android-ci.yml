name: Android CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: app/src/main/jniLibs
          key: native-ndk28-${{ runner.os }}-${{ hashFiles('native/**', 'scripts/build-native.sh', '.gitmodules') }}
      - name: Install pinned SDK and NDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ '${{ steps.native-cache.outputs.cache-hit }}' != 'true' ]; then sdkmanager 'ndk;28.2.13676358'; fi
      - name: Build local forwarding engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build-native.sh 2>&1 | tee native-build.log
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: app/src/main/jniLibs
          key: native-ndk28-${{ runner.os }}-${{ hashFiles('native/**', 'scripts/build-native.sh', '.gitmodules') }}
      - name: Test, Lint and assemble
        run: |
          chmod +x gradlew
          set -o pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --continue --stacktrace 2>&1 | tee android-build.log
      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/sososafe.apk
          cd dist && sha256sum sososafe.apk > sososafe.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sososafe-debug
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sososafe-native
          path: app/src/main/jniLibs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sososafe-test-runner
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - name: Upload tests, Lint and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sososafe-verification
          path: |
            **/build/reports/
            **/build/test-results/
            app/schemas/
            android-build.log
            native-build.log
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: actions/download-artifact@v4
        with:
          name: sososafe-debug
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sososafe-native
          path: app/src/main/jniLibs
      - uses: actions/download-artifact@v4
        with:
          name: sososafe-test-runner
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Emulator launch, scan, UI and IPv4 / IPv6 forwarding tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sososafe-device-verification
          path: |
            artifacts/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
